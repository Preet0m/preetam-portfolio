<style>
/* ============ tokens ============ */
:root{
  --bg:#0b0f14;
  --bg-2:#0e141b;
  --surface:#111925;
  --surface-2:#0d141d;
  --card:rgba(255,255,255,.032);
  --card-2:rgba(255,255,255,.06);
  --ink:#eaf1f8;
  --ink-dim:#c3d0dd;
  --muted:#95a6b8;
  --line:rgba(233,241,248,.10);
  --line-2:rgba(233,241,248,.18);
  --amber:#f0a94b;
  --copper:#d1743c;
  --cyan:#63d6c2;
  --steel:#7fa5c9;
  --rule:linear-gradient(90deg,var(--copper),var(--amber) 55%,transparent);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-h:74px;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --pad:max(5vw,1.25rem);
  --maxw:1440px;
  --e-out:cubic-bezier(.16,.84,.24,1);
}
@media (min-width:1900px){ :root{ --pad:max(8vw,3rem); } }

/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.6 var(--sans);
  font-feature-settings:"ss01","cv05";
  overflow-x:hidden;position:relative;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul{padding:0;list-style:none}
dl{margin:0}
::selection{background:var(--amber);color:#0b0f14}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* texture layers */
.grain{position:fixed;inset:-200%;z-index:0;pointer-events:none;opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation:grainShift 8s steps(6) infinite}
@keyframes grainShift{
  0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}
  60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}
.mesh{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
.mesh i{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.42}
.mesh .m1{width:46vmax;height:46vmax;left:-16vmax;top:-20vmax;background:radial-gradient(circle,rgba(209,116,60,.42),transparent 70%);animation:drift1 30s ease-in-out infinite}
.mesh .m2{width:38vmax;height:38vmax;right:-14vmax;top:14vmax;background:radial-gradient(circle,rgba(99,214,194,.22),transparent 70%);animation:drift2 26s ease-in-out infinite}
.mesh .m3{width:34vmax;height:34vmax;left:12vmax;bottom:-16vmax;background:radial-gradient(circle,rgba(127,165,201,.20),transparent 70%);animation:drift3 34s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(3vmax,4vmax)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-4vmax,2vmax)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(3vmax,-3vmax)}}
.rules{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:calc(100% / 6) 100%;opacity:.5;
  mask-image:linear-gradient(180deg,#000,transparent 55%)}
.spot{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:radial-gradient(520px circle at var(--mx,50%) var(--my,20%),rgba(240,169,75,.075),transparent 62%)}
@media (hover:hover) and (pointer:fine){.spot{opacity:1}}

/* ============ typography helpers ============ */
.mono{font:500 .72rem/1.3 var(--mono);letter-spacing:.13em;text-transform:uppercase}
.eyebrow{font:500 .7rem/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.lede{color:var(--ink-dim);font-size:1.02rem;max-width:56ch}
p{color:var(--muted)}

.shell{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
.section{padding-block:clamp(4.5rem,9vw,8.5rem);position:relative}
.section-head{display:grid;grid-template-columns:minmax(190px,.85fr) 2.2fr;gap:clamp(1.2rem,4vw,3rem);
  align-items:start;padding-top:1.15rem;margin-bottom:clamp(2.4rem,5vw,4.2rem);position:relative}
.section-head::before{content:'';position:absolute;inset-inline:0;top:0;height:1px;background:var(--line)}
.section-head::after{content:'';position:absolute;left:0;top:0;height:1px;width:var(--rulew,0);background:var(--rule);
  transition:width 1s var(--e-out) .05s}
.section-head.visible::after{--rulew:min(340px,42%)}
.snum{display:flex;align-items:baseline;gap:.65rem;color:var(--amber);font:500 .74rem var(--mono);letter-spacing:.14em}
.snum b{font:600 1.55rem/1 var(--serif);letter-spacing:-.02em;color:var(--copper);font-variant-numeric:tabular-nums}
.section h2{font:600 clamp(2.15rem,4.2vw,4.35rem)/1.02 var(--serif);letter-spacing:-.045em;max-width:19ch;text-wrap:balance}
.section h2 em{font-style:italic;color:var(--amber)}
.section-head p{margin-top:1rem;max-width:52ch}

/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:48px;
  padding:.8rem 1.3rem;border:1px solid var(--line-2);border-radius:999px;background:rgba(255,255,255,.035);
  font:600 .82rem var(--sans);letter-spacing:.01em;cursor:pointer;position:relative;overflow:hidden;
  transition:background .25s ease,border-color .25s ease,color .25s ease,box-shadow .3s ease,transform .18s var(--e-out)}
.btn>*{position:relative;z-index:1}
.btn:hover{border-color:rgba(240,169,75,.55);background:rgba(240,169,75,.10);box-shadow:0 10px 30px -12px rgba(240,169,75,.5)}
.btn:active{transform:scale(.975)}
.btn .arw{transition:transform .3s var(--e-out)}
.btn:hover .arw{transform:translate(3px,-3px)}
.btn.solid{background:linear-gradient(135deg,var(--amber),var(--copper));border-color:transparent;color:#160d04}
.btn.solid:hover{box-shadow:0 14px 34px -12px rgba(240,169,75,.75);background:linear-gradient(135deg,#f7b85f,#dd8144)}
.btn.sm{min-height:40px;padding:.5rem 1rem;font-size:.76rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.65rem}

/* ============ progress + nav ============ */
.progress{position:fixed;top:0;left:0;height:2px;width:100%;z-index:130;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--copper),var(--amber) 60%,var(--cyan));will-change:transform}
.nav{position:sticky;top:0;z-index:120;height:var(--nav-h);display:flex;align-items:center;
  background:rgba(11,15,20,.6);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid transparent;transition:border-color .3s ease,background .3s ease,box-shadow .3s ease}
.nav.stuck{border-bottom-color:var(--line);background:rgba(11,15,20,.88);box-shadow:0 12px 34px -18px #000}
.nav .shell{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:700;letter-spacing:-.02em;font-size:.95rem}
.brand .mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line-2);
  background:linear-gradient(140deg,rgba(240,169,75,.20),rgba(99,214,194,.08));flex:none}
.brand .mark img{width:21px;height:21px;object-fit:contain;filter:brightness(0) invert(1)}
.brand small{display:block;font:500 .62rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400}
.navlinks{display:flex;align-items:center;gap:1.5rem;font-size:.82rem;font-weight:600}
.navlinks a:not(.nav-cta){position:relative;color:var(--muted);padding-block:.25rem;transition:color .25s}
.navlinks a:not(.nav-cta)::after{content:'';position:absolute;left:0;bottom:-2px;height:2px;width:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--amber),var(--copper));transform:scaleX(0);transform-origin:0 50%;transition:transform .3s var(--e-out)}
.navlinks a:hover,.navlinks a[aria-current="true"]{color:var(--ink)}
.navlinks a:hover::after,.navlinks a[aria-current="true"]::after{transform:scaleX(1)}
.nav-cta{background:linear-gradient(135deg,var(--amber),var(--copper));color:#160d04;padding:.58rem 1.05rem;border-radius:999px}
.nav-cta:hover{filter:brightness(1.06)}
.burger{display:none;width:46px;height:46px;border:1px solid var(--line-2);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer;
  align-items:center;justify-content:center;flex-direction:column;gap:5px}
.burger span{display:block;width:18px;height:1.5px;background:var(--ink);border-radius:2px;transition:transform .3s var(--e-out),opacity .2s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.skip{position:fixed;z-index:200;left:1rem;top:-6rem;padding:.75rem 1.1rem;background:var(--amber);color:#160d04;border-radius:10px;font-weight:700}
.skip:focus{top:1rem}

/* ============ hero ============ */
.hero{position:relative;padding-block:clamp(2.5rem,6vw,5rem) clamp(3rem,6vw,5.5rem)}
.hero .shell{display:grid;grid-template-columns:1.25fr .82fr;gap:clamp(1.6rem,4vw,4.5rem);align-items:center}
.hero-copy{min-width:0}
.status{display:inline-flex;align-items:center;gap:.6rem;padding:.45rem .9rem .45rem .7rem;border:1px solid var(--line-2);
  border-radius:999px;background:rgba(99,214,194,.06);font:500 .7rem var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim)}
.status .led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(99,214,194,.16);animation:led 2.4s ease-in-out infinite}
@keyframes led{0%,100%{box-shadow:0 0 0 4px rgba(99,214,194,.16)}50%{box-shadow:0 0 0 9px rgba(99,214,194,.02)}}
.hero h1{margin:1.5rem 0 0;font:600 clamp(2.9rem,7.4vw,6.6rem)/.93 var(--serif);letter-spacing:-.055em;text-wrap:balance}
.hero h1 .l2{display:block;font-style:italic;font-weight:500;
  background:linear-gradient(100deg,var(--amber),var(--copper) 45%,var(--steel));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-role{margin-top:1.1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.55rem .8rem;
  font:500 .74rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.hero-role .sep{display:inline-block;width:26px;height:1px;background:var(--line-2)}
.hero p.pitch{margin-top:1.35rem;font-size:1.05rem;line-height:1.65;max-width:48ch;color:var(--ink-dim)}
.hero .btn-row{margin-top:1.9rem}
.hero-meta{margin-top:2.2rem;padding-top:1.2rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:1.6rem}
.hero-meta div{min-width:0}
.hero-meta dt{font:500 .64rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.hero-meta dd{margin:0;font-size:.9rem;font-weight:600;color:var(--ink)}

/* portrait */
.portrait{position:relative;perspective:1100px;justify-self:end;width:100%;max-width:430px}
.portrait-frame{position:relative;border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line-2);
  background:var(--surface-2);aspect-ratio:3/4;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s var(--e-out);
  box-shadow:0 44px 90px -40px rgba(0,0,0,.9),0 0 0 1px rgba(240,169,75,.06)}
.portrait-frame img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;
  filter:grayscale(.62) contrast(1.06) brightness(.94);transform:scale(1.05) translateY(var(--par,0px));transition:filter .6s ease,transform .1s linear}
.portrait:hover .portrait-frame img{filter:grayscale(.18) contrast(1.04) brightness(1)}
.portrait-frame::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(165deg,rgba(240,169,75,.20),transparent 42%),
             linear-gradient(0deg,rgba(11,15,20,.88),rgba(11,15,20,.05) 52%),
             radial-gradient(120% 80% at 80% 0%,rgba(99,214,194,.14),transparent 60%);
  mix-blend-mode:screen;opacity:.9}
.portrait-frame::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(0deg,rgba(11,15,20,.72),transparent 46%)}
.portrait-tag{position:absolute;z-index:3;left:1rem;right:1rem;bottom:1rem;display:flex;align-items:end;justify-content:space-between;gap:.75rem}
.portrait-tag .nm{font:600 1.05rem/1.15 var(--serif);letter-spacing:-.02em}
.portrait-tag .nm span{display:block;font:500 .64rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-top:.3rem}
.portrait-tag .loc{font:500 .62rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
.portrait .corner{position:absolute;width:64px;height:64px;border:1px solid var(--line-2);pointer-events:none}
.portrait .c-tl{top:-13px;left:-13px;border-right:0;border-bottom:0;border-top-left-radius:12px;border-color:rgba(240,169,75,.5)}
.portrait .c-br{bottom:-13px;right:-13px;border-left:0;border-top:0;border-bottom-right-radius:12px;border-color:rgba(99,214,194,.42)}
.portrait .stamp{position:absolute;z-index:4;right:-18px;top:16%;padding:.5rem .8rem;border-radius:999px;
  background:rgba(11,15,20,.9);border:1px solid rgba(240,169,75,.4);backdrop-filter:blur(8px);
  font:500 .62rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);white-space:nowrap;
  box-shadow:0 12px 30px -14px rgba(0,0,0,.9)}

/* ============ metric strip ============ */
.strip{border-block:1px solid var(--line);background:linear-gradient(160deg,var(--surface),var(--surface-2))}
.strip .shell{display:grid;grid-template-columns:repeat(4,1fr)}
.metric{padding:clamp(1.6rem,3vw,2.6rem) 1.3rem clamp(1.6rem,3vw,2.6rem) 0;border-right:1px solid var(--line);margin-right:1.3rem}
.metric:last-child{border-right:0;margin-right:0;padding-right:0}
.metric b{display:block;font:600 clamp(1.9rem,3.6vw,3.3rem)/1 var(--serif);letter-spacing:-.045em;
  color:var(--amber);font-variant-numeric:tabular-nums}
.metric span{display:block;margin-top:.6rem;max-width:20rem;font:400 .78rem/1.5 var(--sans);color:var(--muted)}

/* ============ recruiters ============ */
.recruit{background:
  radial-gradient(90% 60% at 12% 0%,rgba(240,169,75,.08),transparent 60%),
  linear-gradient(180deg,var(--bg),var(--bg-2) 40%,var(--bg))}
.recruit-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem}
.rcard{grid-column:span 3;padding:1.35rem 1.3rem;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--card);display:flex;flex-direction:column;gap:.55rem;position:relative;overflow:hidden;
  transition:border-color .3s,background .3s,transform .3s var(--e-out)}
.rcard::before{content:'';position:absolute;left:0;top:0;width:100%;height:1px;background:var(--rule);opacity:0;transition:opacity .3s}
.rcard:hover{border-color:rgba(240,169,75,.34);background:var(--card-2);transform:translateY(-4px)}
.rcard:hover::before{opacity:1}
.rcard dt{font:500 .64rem var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.rcard dd{margin:0;font-size:.98rem;font-weight:600;line-height:1.45;color:var(--ink)}
.rcard dd small{display:block;font-size:.8rem;font-weight:400;color:var(--muted);margin-top:.3rem}
.rcard.wide{grid-column:span 6}
.rcard .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.15rem}
.chip{font:500 .68rem var(--mono);letter-spacing:.06em;padding:.3rem .6rem;border-radius:999px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--ink-dim);white-space:nowrap}
.chip.hot{border-color:rgba(99,214,194,.4);color:var(--cyan);background:rgba(99,214,194,.07)}

.action-panel{grid-column:span 6;display:flex;flex-direction:column;gap:1rem;justify-content:center;
  padding:1.6rem;border:1px solid rgba(240,169,75,.28);border-radius:var(--r-m);
  background:linear-gradient(150deg,rgba(240,169,75,.10),rgba(99,214,194,.05) 70%,transparent)}
.action-panel h3{font:600 1.35rem/1.2 var(--serif);let
